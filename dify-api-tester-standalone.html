<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dify API 测试工具</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link href="https://unpkg.com/antd@5.12.8/dist/reset.css" rel="stylesheet">
    <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://unpkg.com/antd@5.12.8/dist/antd.min.js"></script>
    <link href="https://unpkg.com/antd@5.12.8/dist/antd.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
        }
        #root {
            min-height: 100vh;
        }
        .api-tester-container {
            min-height: 100vh;
            background: #fff;
        }
        .header {
            background: #001529;
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .main-content {
            display: flex;
            height: calc(100vh - 64px);
        }
        .sidebar {
            width: 280px;
            background: #f0f2f5;
            border-right: 1px solid #e8e8e8;
            overflow-y: auto;
        }
        .content-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        .api-section {
            margin-bottom: 24px;
        }
        .api-group-title {
            font-size: 16px;
            font-weight: 600;
            color: #1890ff;
            margin-bottom: 12px;
            padding: 8px 16px;
            background: #e6f7ff;
            border-left: 3px solid #1890ff;
        }
        .api-item {
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 1px solid #f0f0f0;
        }
        .api-item:hover {
            background: #f0f7ff;
        }
        .api-item.active {
            background: #e6f7ff;
            border-left: 3px solid #1890ff;
        }
        .config-section {
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 24px;
        }
        .request-section {
            background: #fff;
            padding: 20px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            margin-bottom: 24px;
        }
        .response-section {
            background: #f9f9f9;
            padding: 20px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
        }
        .json-viewer {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            overflow-x: auto;
        }
        .streaming-content {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }
        .history-item {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.3s;
        }
        .history-item:hover {
            background: #f5f5f5;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-success {
            background: #f0f9ff;
            color: #0c9;
        }
        .status-error {
            background: #fff0f0;
            color: #f44;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { 
            Layout, Menu, Input, Button, Form, Select, Card, Tabs, Space, 
            message, Divider, Typography, Tag, Collapse, Upload, Switch,
            Radio, InputNumber, Tooltip, Modal, Table, Alert, Spin
        } = antd;
        
        const { Header, Sider, Content } = Layout;
        const { TextArea } = Input;
        const { Title, Text } = Typography;
        const { Panel } = Collapse;
        const { Option } = Select;

        // API 配置
        const API_GROUPS = {
            chat: {
                name: '对话与智能体 (Chat & Agent)',
                apis: [
                    { 
                        id: 'chat-messages', 
                        name: '发送对话消息', 
                        path: '/chat-messages',
                        method: 'POST',
                        description: '创建对话消息，支持阻塞和流式响应'
                    },
                    { 
                        id: 'stop-chat', 
                        name: '停止对话生成', 
                        path: '/chat-messages/:task_id/stop',
                        method: 'POST',
                        description: '停止正在生成的对话响应'
                    },
                    { 
                        id: 'chat-suggestions', 
                        name: '获取建议问题', 
                        path: '/chat-messages/:message_id/suggested-questions',
                        method: 'GET',
                        description: '获取下一轮对话的建议问题'
                    },
                    { 
                        id: 'conversations', 
                        name: '会话管理', 
                        path: '/conversations',
                        method: 'GET',
                        description: '获取会话列表'
                    },
                    { 
                        id: 'messages', 
                        name: '消息历史', 
                        path: '/messages',
                        method: 'GET',
                        description: '获取消息历史记录'
                    },
                    { 
                        id: 'message-feedback', 
                        name: '消息反馈', 
                        path: '/messages/:message_id/feedbacks',
                        method: 'POST',
                        description: '对消息进行点赞或点踩'
                    }
                ]
            },
            knowledge: {
                name: '知识库 (Knowledge Base)',
                apis: [
                    { 
                        id: 'create-dataset', 
                        name: '创建知识库', 
                        path: '/datasets',
                        method: 'POST',
                        description: '创建一个新的空知识库'
                    },
                    { 
                        id: 'list-datasets', 
                        name: '获取知识库列表', 
                        path: '/datasets',
                        method: 'GET',
                        description: '获取所有知识库列表'
                    },
                    { 
                        id: 'delete-dataset', 
                        name: '删除知识库', 
                        path: '/datasets/:dataset_id',
                        method: 'DELETE',
                        description: '删除指定的知识库'
                    },
                    { 
                        id: 'create-document-text', 
                        name: '通过文本创建文档', 
                        path: '/datasets/:dataset_id/document/create_by_text',
                        method: 'POST',
                        description: '使用文本内容创建新文档'
                    },
                    { 
                        id: 'create-document-file',
                        name: '通过文件创建文档',
                        path: '/datasets/:dataset_id/document/create_by_file',
                        method: 'POST',
                        description: '上传文件创建新文档'
                    },
                    { 
                        id: 'update-document-text', 
                        name: '更新文档(文本)', 
                        path: '/datasets/:dataset_id/documents/:document_id/update_by_text',
                        method: 'POST',
                        description: '使用文本更新已有文档'
                    },
                    { 
                        id: 'update-document-file',
                        name: '更新文档(文件)',
                        path: '/datasets/:dataset_id/documents/:document_id/update_by_file',
                        method: 'POST',
                        description: '使用文件更新已有文档'
                    },
                    { 
                        id: 'list-documents', 
                        name: '获取文档列表', 
                        path: '/datasets/:dataset_id/documents',
                        method: 'GET',
                        description: '获取知识库中的文档列表'
                    },
                    { 
                        id: 'delete-document', 
                        name: '删除文档', 
                        path: '/datasets/:dataset_id/documents/:document_id',
                        method: 'DELETE',
                        description: '删除指定文档'
                    },
                    { 
                        id: 'document-status',
                        name: '获取文档嵌入状态',
                        path: '/datasets/:dataset_id/document/indexing-status',
                        method: 'GET',
                        description: '查询文档处理进度（使用 batch 作为查询参数）'
                    },
                    { 
                        id: 'add-segments', 
                        name: '添加文档分段', 
                        path: '/datasets/:dataset_id/documents/:document_id/segments',
                        method: 'POST',
                        description: '向文档添加新的分段内容'
                    },
                    { 
                        id: 'list-segments', 
                        name: '获取文档分段', 
                        path: '/datasets/:dataset_id/documents/:document_id/segments',
                        method: 'GET',
                        description: '获取文档的所有分段'
                    },
                    { 
                        id: 'update-segment', 
                        name: '更新分段', 
                        path: '/datasets/:dataset_id/documents/:document_id/segments/:segment_id',
                        method: 'POST',
                        description: '更新指定分段内容'
                    },
                    { 
                        id: 'delete-segment', 
                        name: '删除分段', 
                        path: '/datasets/:dataset_id/documents/:document_id/segments/:segment_id',
                        method: 'DELETE',
                        description: '删除指定分段'
                    },
                    { 
                        id: 'retrieve-chunks', 
                        name: '检索知识库', 
                        path: '/datasets/:dataset_id/retrieve',
                        method: 'POST',
                        description: '从知识库中检索相关内容'
                    }
                ]
            },
            workflow: {
                name: '工作流 (Workflow)',
                apis: [
                    { 
                        id: 'run-workflow', 
                        name: '执行工作流', 
                        path: '/workflows/run',
                        method: 'POST',
                        description: '执行工作流，支持阻塞和流式响应'
                    },
                    { 
                        id: 'stop-workflow', 
                        name: '停止工作流', 
                        path: '/workflows/:task_id/stop',
                        method: 'POST',
                        description: '停止正在执行的工作流'
                    }
                ]
            },
            completion: {
                name: '文本生成 (Text Completion)',
                apis: [
                    { 
                        id: 'completion-messages', 
                        name: '文本生成', 
                        path: '/completion-messages',
                        method: 'POST',
                        description: '生成文本内容，支持阻塞和流式响应'
                    },
                    { 
                        id: 'stop-completion', 
                        name: '停止文本生成', 
                        path: '/completion-messages/:task_id/stop',
                        method: 'POST',
                        description: '停止正在生成的文本'
                    }
                ]
            }
        };

        // 主应用组件
        const DifyApiTester = () => {
            const [config, setConfig] = useState({
                baseUrl: 'https://api.dify.ai/v1',
                apiKey: ''
            });
            
            const [selectedApi, setSelectedApi] = useState(null);
            const [requestData, setRequestData] = useState({});
            const [response, setResponse] = useState(null);
            const [loading, setLoading] = useState(false);
            const [streamingData, setStreamingData] = useState('');
            const [history, setHistory] = useState([]);
            const [isStreaming, setIsStreaming] = useState(false);
            
            const streamingRef = useRef(null);

            // 处理 API 选择
            const handleApiSelect = (api) => {
                setSelectedApi(api);
                setResponse(null);
                setStreamingData('');
                
                // 根据 API 设置默认请求数据
                const defaultData = getDefaultRequestData(api);
                setRequestData(defaultData);
            };

            // 获取默认请求数据
            const getDefaultRequestData = (api) => {
                switch (api.id) {
                    case 'chat-messages':
                        return {
                            inputs: {},
                            query: "你好，请介绍一下你自己",
                            response_mode: "blocking",
                            user: "test-user",
                            conversation_id: "",
                            files: []
                        };
                    
                    case 'create-dataset':
                        return {
                            name: "测试知识库",
                            description: "这是一个测试知识库",
                            permission: "only_me"
                        };
                    
                    case 'create-document-text':
                        return {
                            name: "测试文档",
                            text: "这是测试文档的内容",
                            indexing_technique: "high_quality",
                            process_rule: {
                                mode: "automatic"
                            }
                        };
                    
                    case 'retrieve-chunks':
                        return {
                            query: "测试查询",
                            retrieval_model: {
                                search_method: "hybrid_search",
                                reranking_enable: false,
                                top_k: 5,
                                score_threshold_enabled: false,
                                score_threshold: 0
                            }
                        };

                    case 'document-status':
                        return {
                            dataset_id: "",
                            batch: ""
                        };
                    
                    case 'completion-messages':
                        return {
                            inputs: {
                                query: "请生成一段关于人工智能的介绍"
                            },
                            response_mode: "blocking",
                            user: "test-user"
                        };
                    
                    case 'run-workflow':
                        return {
                            inputs: {},
                            response_mode: "blocking",
                            user: "test-user"
                        };
                    
                    default:
                        return {};
                }
            };

            const getPathParamNames = (api) => api.path.match(/:(\w+)/g)?.map(param => param.substring(1)) || [];

            // 构建请求 URL
            const buildRequestUrl = (api, includeQuery = false) => {
                let url = config.baseUrl + api.path;

                const pathParamNames = getPathParamNames(api);
                pathParamNames.forEach(paramName => {
                    const value = requestData[paramName] || '';
                    url = url.replace(`:${paramName}`, encodeURIComponent(value));
                });

                if (includeQuery && api.method === 'GET') {
                    const queryParams = Object.entries(requestData || {})
                        .filter(([key, value]) => !pathParamNames.includes(key) && value !== undefined && value !== '')
                        .map(([key, value]) => [key, typeof value === 'string' ? value : JSON.stringify(value)]);

                    if (queryParams.length) {
                        const searchParams = new URLSearchParams(queryParams);
                        url += `${url.includes('?') ? '&' : '?'}${searchParams.toString()}`;
                    }
                }

                return url;
            };

            // 发送请求
            const sendRequest = async () => {
                if (!config.apiKey) {
                    message.error('请先配置 API Key');
                    return;
                }
                
                if (!selectedApi) {
                    message.error('请先选择一个 API');
                    return;
                }
                
                setLoading(true);
                setResponse(null);
                setStreamingData('');

                const url = buildRequestUrl(selectedApi, true);
                const pathParamNames = getPathParamNames(selectedApi);
                const headers = {
                    'Authorization': `Bearer ${config.apiKey}`,
                    'Content-Type': 'application/json'
                };
                
                try {
                    // 检查是否是流式响应
                    const isStreamingRequest = requestData.response_mode === 'streaming';
                    
                    if (isStreamingRequest) {
                        // 处理流式响应
                        setIsStreaming(true);
                        const response = await fetch(url, {
                            method: selectedApi.method,
                            headers: headers,
                            body: selectedApi.method !== 'GET' ? JSON.stringify(requestData) : undefined
                        });
                        
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            
                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop() || '';
                            
                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    const data = line.substring(6);
                                    if (data === '[DONE]') continue;
                                    
                                    try {
                                        const parsed = JSON.parse(data);
                                        setStreamingData(prev => prev + JSON.stringify(parsed, null, 2) + '\n\n');
                                    } catch (e) {
                                        console.error('Parse error:', e);
                                    }
                                }
                            }
                        }
                        
                        setIsStreaming(false);
                    } else {
                        // 处理普通请求
                        let axiosConfig = {
                            method: selectedApi.method,
                            url: buildRequestUrl(selectedApi),
                            headers: headers
                        };

                        if (selectedApi.method !== 'GET') {
                            axiosConfig.data = requestData;
                        } else {
                            const queryParams = Object.fromEntries(
                                Object.entries(requestData || {}).filter(([key, value]) => !pathParamNames.includes(key) && value !== undefined && value !== '')
                            );

                            if (Object.keys(queryParams).length) {
                                axiosConfig.params = queryParams;
                            }
                        }
                        
                        const result = await axios(axiosConfig);
                        setResponse(result.data);
                    }
                    
                    // 添加到历史记录
                    const historyItem = {
                        id: Date.now(),
                        timestamp: new Date().toLocaleString(),
                        api: selectedApi.name,
                        method: selectedApi.method,
                        url: url,
                        status: 'success',
                        request: requestData,
                        response: response || { streaming: true }
                    };
                    
                    setHistory(prev => [historyItem, ...prev.slice(0, 19)]);
                    message.success('请求成功');
                    
                } catch (error) {
                    console.error('Request error:', error);
                    setResponse({ error: error.message });
                    
                    const historyItem = {
                        id: Date.now(),
                        timestamp: new Date().toLocaleString(),
                        api: selectedApi.name,
                        method: selectedApi.method,
                        url: url,
                        status: 'error',
                        request: requestData,
                        response: { error: error.message }
                    };
                    
                    setHistory(prev => [historyItem, ...prev.slice(0, 19)]);
                    message.error('请求失败: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };

            // 渲染侧边栏
            const renderSidebar = () => (
                <Sider width={280} style={{ background: '#f0f2f5' }}>
                    <div style={{ padding: '16px' }}>
                        <Title level={5}>API 列表</Title>
                    </div>
                    {Object.entries(API_GROUPS).map(([groupKey, group]) => (
                        <div key={groupKey} className="api-section">
                            <div className="api-group-title">{group.name}</div>
                            {group.apis.map(api => (
                                <div
                                    key={api.id}
                                    className={`api-item ${selectedApi?.id === api.id ? 'active' : ''}`}
                                    onClick={() => handleApiSelect(api)}
                                >
                                    <Tag color={api.method === 'GET' ? 'green' : api.method === 'POST' ? 'blue' : 'red'}>
                                        {api.method}
                                    </Tag>
                                    <span style={{ marginLeft: 8 }}>{api.name}</span>
                                </div>
                            ))}
                        </div>
                    ))}
                </Sider>
            );

            // 渲染请求参数表单
            const renderRequestForm = () => {
                if (!selectedApi) return null;
                
                return (
                    <Card title="请求参数" className="request-section">
                        <Form layout="vertical">
                            <Form.Item label="请求 URL">
                                <Input value={buildRequestUrl(selectedApi, true)} disabled />
                            </Form.Item>
                            
                            <Form.Item label="请求方法">
                                <Tag color={selectedApi.method === 'GET' ? 'green' : selectedApi.method === 'POST' ? 'blue' : 'red'}>
                                    {selectedApi.method}
                                </Tag>
                            </Form.Item>
                            
                            {selectedApi.path.includes(':') && (
                                <Alert
                                    message="路径参数"
                                    description="请在下方的请求体中填写路径参数值"
                                    type="info"
                                    showIcon
                                    style={{ marginBottom: 16 }}
                                />
                            )}
                            
                            {selectedApi.method !== 'GET' && (
                                <Form.Item label="请求体 (JSON)">
                                    <TextArea
                                        rows={10}
                                        value={JSON.stringify(requestData, null, 2)}
                                        onChange={(e) => {
                                            try {
                                                const data = JSON.parse(e.target.value);
                                                setRequestData(data);
                                            } catch (error) {
                                                // JSON 解析错误，暂时不处理
                                            }
                                        }}
                                        style={{ fontFamily: 'monospace' }}
                                    />
                                </Form.Item>
                            )}
                            
                            <Form.Item>
                                <Button
                                    type="primary"
                                    onClick={sendRequest}
                                    loading={loading}
                                    size="large"
                                    block
                                >
                                    发送请求
                                </Button>
                            </Form.Item>
                        </Form>
                    </Card>
                );
            };

            // 渲染响应结果
            const renderResponse = () => {
                if (!response && !streamingData) return null;
                
                return (
                    <Card title="响应结果" className="response-section">
                        {streamingData ? (
                            <div>
                                <Title level={5}>流式响应数据</Title>
                                <div className="streaming-content">
                                    <pre>{streamingData}</pre>
                                </div>
                            </div>
                        ) : (
                            <div className="json-viewer">
                                <pre>{JSON.stringify(response, null, 2)}</pre>
                            </div>
                        )}
                    </Card>
                );
            };

            // 渲染历史记录
            const renderHistory = () => (
                <Card title="请求历史" style={{ marginTop: 24 }}>
                    <div style={{ maxHeight: 400, overflow: 'auto' }}>
                        {history.length === 0 ? (
                            <Text type="secondary">暂无请求历史</Text>
                        ) : (
                            history.map(item => (
                                <div key={item.id} className="history-item">
                                    <Space direction="vertical" style={{ width: '100%' }}>
                                        <Space>
                                            <Text type="secondary">{item.timestamp}</Text>
                                            <Tag color={item.method === 'GET' ? 'green' : item.method === 'POST' ? 'blue' : 'red'}>
                                                {item.method}
                                            </Tag>
                                            <Text strong>{item.api}</Text>
                                            <span className={`status-badge status-${item.status}`}>
                                                {item.status === 'success' ? '成功' : '失败'}
                                            </span>
                                        </Space>
                                        <Text type="secondary" style={{ fontSize: 12 }}>{item.url}</Text>
                                    </Space>
                                </div>
                            ))
                        )}
                    </div>
                </Card>
            );

            return (
                <Layout className="api-tester-container">
                    <Header className="header">
                        <div className="logo">
                            <span>🚀</span>
                            <span>Dify API 测试工具</span>
                        </div>
                        <Space>
                            <Input
                                placeholder="Base URL"
                                value={config.baseUrl}
                                onChange={(e) => setConfig({ ...config, baseUrl: e.target.value })}
                                style={{ width: 300 }}
                            />
                            <Input.Password
                                placeholder="API Key"
                                value={config.apiKey}
                                onChange={(e) => setConfig({ ...config, apiKey: e.target.value })}
                                style={{ width: 300 }}
                            />
                        </Space>
                    </Header>
                    
                    <Layout className="main-content">
                        {renderSidebar()}
                        
                        <Content className="content-area">
                            {selectedApi ? (
                                <>
                                    <Title level={3}>{selectedApi.name}</Title>
                                    <Text type="secondary">{selectedApi.description}</Text>
                                    <Divider />
                                    
                                    {renderRequestForm()}
                                    {renderResponse()}
                                    {renderHistory()}
                                </>
                            ) : (

                                </div>
                            )}
                        </Content>
                    </Layout>
                </Layout>
            );
        };

        // 渲染应用
        ReactDOM.render(<DifyApiTester />, document.getElementById('root'));
